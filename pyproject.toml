[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-perception"
version = "0.1.0"
description = "Video-based driving perception: detection, multi-object tracking, and a learned temporal motion model"
requires-python = ">=3.10"
dependencies = [
    "motmetrics>=1.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
video = ["torch>=2.2", "ultralytics>=8.3", "imageio>=2.34", "opencv-python>=4.8"]
dev = ["pytest>=8", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
